name: Release

# Pubblica una release con gli eseguibili pronti per tutti i sistemi.
# Si avvia con un tag:  git tag v0.1.0 && git push origin v0.1.0
# oppure a mano da GitHub → Actions → Release → Run workflow.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Versione da pubblicare (es. v0.1.0): il tag viene creato se non esiste"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create-release:
    name: crea la release
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.rel.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Sectora $TAG" --notes-file .github/release-notes.md
          fi
          echo "id=$(gh release view "$TAG" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  cli:
    name: CLI ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04, target: x86_64-unknown-linux-musl }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { name: macos-universal, os: macos-latest, target: universal }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: windows-arm64, os: windows-latest, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      - name: musl (Linux, binario statico che gira su qualsiasi distribuzione)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Compila (Linux e Windows)
        if: matrix.target != 'universal'
        run: cargo build --release -p sectora-cli --target ${{ matrix.target }}

      - name: Compila (macOS universale, Apple Silicon + Intel)
        if: matrix.target == 'universal'
        run: |
          cargo build --release -p sectora-cli --target aarch64-apple-darwin
          cargo build --release -p sectora-cli --target x86_64-apple-darwin
          mkdir -p target/universal/release
          lipo -create -output target/universal/release/sectora \
            target/aarch64-apple-darwin/release/sectora target/x86_64-apple-darwin/release/sectora

      - name: Pacchetto (Linux e macOS)
        if: runner.os != 'Windows'
        run: |
          dir="sectora-cli-$TAG-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/sectora" README.md LICENSE "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"

      - name: Pacchetto (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "sectora-cli-$env:TAG-${{ matrix.name }}"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/sectora.exe", README.md, LICENSE $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          "ASSET=$dir.zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Carica nella release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" --clobber

  desktop:
    name: App ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS universale, os: macos-latest, args: "--target universal-apple-darwin" }
          - { name: Windows, os: windows-latest, args: "" }
          - { name: Linux, os: ubuntu-22.04, args: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.os }}
      - name: Librerie di sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Dipendenze npm
        working-directory: apps/desktop
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create-release.outputs.id }}
          args: ${{ matrix.args }}

  checksums:
    name: checksum SHA-256
    needs: [cli, desktop]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --skip-existing
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
