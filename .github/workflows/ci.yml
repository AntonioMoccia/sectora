name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: motore e CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formattazione
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy -p sectora-engine -p sectora-cli --all-targets -- -D warnings
      - name: Test
        run: cargo test -p sectora-engine -p sectora-cli

  filesystems:
    name: prove su file system reali (FAT, exFAT, NTFS, formattazione)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y dosfstools mtools exfatprogs exfat-fuse ntfs-3g
      - run: pip install pillow
      - run: cargo build --release -p sectora-cli
      - run: sudo python3 scripts/fs-test.py
      - run: ./scripts/fat-test.sh

  desktop:
    name: app desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Librerie di sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - working-directory: apps/desktop
        run: npm ci && npm run build
      - name: Lint e test backend
        run: cargo clippy -p sectora-desktop --all-targets -- -D warnings && cargo test -p sectora-desktop
      - working-directory: apps/desktop
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: sectora-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
